# Media PVC: user uploads + annotated images (MEDIA_ROOT=/app/media) live here
# so they persist across pod restarts and image redeploys.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  # Recreate so the single RWO media volume is released before the new pod
  # mounts it on redeploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Using lowercase rayane-aboud as required by GHCR
        image: ghcr.io/rayane-aboud/aircrop-backend:latest
        ports:
        - containerPort: 8000
        # DB credentials + host come from the Postgres secret. Presence of
        # POSTGRES_DB flips Django to the Postgres backend (see settings.py).
        envFrom:
        - secretRef:
            name: postgres-secret
        # Gemini key for the LLM-written detailed report (api/llm.py).
        # Kept OUT of git in a Kubernetes Secret — GitHub push protection blocks
        # committing the raw key. Create it once, out-of-band (not in git):
        #   kubectl create secret generic gemini-secret \
        #     --from-literal=api-key='YOUR_GEMINI_KEY'
        # If the key/quota is unavailable the app falls back to the template report.
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-secret
              key: api-key
        # 'gemini-flash-latest' is a stable alias; override here if needed.
        - name: GEMINI_MODEL
          value: "gemini-flash-latest"
        # WebODM (orthomosaics, api/webodm.py). WebODM runs as its own stack,
        # NOT in this cluster: on a host with Docker,
        #   git clone https://github.com/WebODM/WebODM && cd WebODM
        #   ./webodm.sh start --detached --port 8010
        # then create a dedicated user in its UI (Administration → Accounts)
        # and store the URL + that user's credentials, out-of-band:
        #   kubectl create secret generic webodm-secret \
        #     --from-literal=url='http://<webodm-host>:8010' \
        #     --from-literal=username='aircrop' --from-literal=password='...'
        # optional: true — without the secret the Orthomosaic tab just shows
        # "not enabled" and the rest of the app is unaffected.
        - name: WEBODM_URL
          valueFrom:
            secretKeyRef:
              name: webodm-secret
              key: url
              optional: true
        - name: WEBODM_USERNAME
          valueFrom:
            secretKeyRef:
              name: webodm-secret
              key: username
              optional: true
        - name: WEBODM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: webodm-secret
              key: password
              optional: true
        volumeMounts:
        - name: media
          mountPath: /app/media
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
