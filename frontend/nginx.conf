# Production nginx for the Aircrop SPA.
#
# The dev server (vite.config.ts) proxies /api and /media to the backend;
# this reproduces that in production so the built app works the same way.
# /api and /media are forwarded to the in-cluster backend Service; everything
# else serves the static SPA with an index.html fallback.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow reasonably large crop-photo uploads (nginx default is only 1 MB).
    client_max_body_size 25m;

    # Backend API — no trailing path on proxy_pass, so the full /api/... URI
    # is forwarded unchanged. backend-service is the k8s Service (port 8000).
    location /api/ {
        proxy_pass http://backend-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User-uploaded + annotated images, served by Django from MEDIA_ROOT.
    location /media/ {
        proxy_pass http://backend-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: fall back to index.html so client-side routes / refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
